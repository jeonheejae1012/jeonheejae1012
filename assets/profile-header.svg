<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">HEEJAE'S GITHUB</title>
  <desc id="desc">코드로 또 하나의 세계를 만드려는 창작자</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b13"/>
      <stop offset="0.55" stop-color="#16111e"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fae"/>
      <stop offset="0.5" stop-color="#df65b4"/>
      <stop offset="1" stop-color="#925bd0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff6fae" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff6fae" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#background)"/>
  <circle cx="880" cy="70" r="180" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="250" cy="260" r="150" fill="#925bd0" opacity="0.09" filter="url(#softGlow)"/>

  <g opacity="0.38" fill="none" stroke="#ff8fbd">
    <path d="M70 58h110M1020 215h110"/>
    <circle cx="70" cy="58" r="5" fill="#ff8fbd" stroke="none"/>
    <circle cx="1130" cy="215" r="5" fill="#ff8fbd" stroke="none"/>
  </g>

  <text x="600" y="112" text-anchor="middle" fill="#f8f5fb" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2">HEEJAE'S GITHUB</text>
  <rect x="391" y="132" width="418" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="176" text-anchor="middle" fill="#ff9bc6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">코드로 또 하나의 세계를 만드려는 창작자</text>
  <text x="600" y="220" text-anchor="middle" fill="#aab0c0" font-family="Consolas, monospace" font-size="17" letter-spacing="1">C++  •  Python  •  Unity  •  Unreal Engine  •  JavaScript</text>
</svg>
