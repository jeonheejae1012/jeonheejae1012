<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">HEEJAE — World Builder</title>
  <desc id="desc">코드로 또 하나의 세계를 만드려는 창작자</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.52" stop-color="#091426"/>
      <stop offset="1" stop-color="#10112b"/>
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53d8fb"/>
      <stop offset="0.5" stop-color="#16c7d9"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <radialGradient id="portalGlow">
      <stop offset="0" stop-color="#53d8fb" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#53d8fb" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#53d8fb" fill-opacity="0.18"/>
      <animate attributeName="x" values="0;34" dur="7s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect width="1200" height="340" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect y="0" width="1200" height="2" fill="url(#cyanViolet)" opacity="0.8"/>

    <rect x="-240" y="0" width="240" height="340" fill="url(#cyanViolet)" opacity="0.035">
      <animate attributeName="x" values="-240;1200" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(80 70)">
      <text x="0" y="0" fill="#53d8fb" font-family="Consolas, monospace" font-size="14" letter-spacing="4">CREATOR_ID // HEEJAE</text>

      <text x="0" y="74" fill="#f1f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="4">WORLD</text>
      <text x="0" y="138" fill="url(#cyanViolet)" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="4">BUILDER</text>

      <path d="M0 164H490" stroke="#53d8fb" stroke-opacity="0.28"/>
      <circle cx="0" cy="164" r="4" fill="#53d8fb"/>
      <circle cx="490" cy="164" r="4" fill="#8b7cff"/>

      <text x="0" y="204" fill="#c4d3e8" font-family="Segoe UI, Arial, sans-serif" font-size="20">코드로 또 하나의 세계를 만드려는 창작자</text>
      <text x="0" y="242" fill="#74839b" font-family="Consolas, monospace" font-size="15" letter-spacing="1.5">C++ / PYTHON / UNITY / UNREAL ENGINE / JAVASCRIPT</text>
    </g>

    <g transform="translate(925 170)">
      <circle r="138" fill="url(#portalGlow)">
        <animate attributeName="r" values="126;144;126" dur="5s" repeatCount="indefinite"/>
      </circle>

      <g fill="none" transform="rotate(-12)">
        <ellipse rx="142" ry="60" stroke="#53d8fb" stroke-width="2" stroke-opacity="0.55">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse rx="112" ry="112" stroke="#8b7cff" stroke-width="1.5" stroke-dasharray="5 12" stroke-opacity="0.72">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse rx="78" ry="125" stroke="#16c7d9" stroke-width="1.2" stroke-dasharray="2 9" stroke-opacity="0.55">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <g filter="url(#glow)">
        <path d="M0 -58L52 -28L52 31L0 61L-52 31L-52 -28Z" fill="#0b1830" fill-opacity="0.92" stroke="url(#cyanViolet)" stroke-width="2"/>
        <path d="M0 -58V0M52 -28L0 0M-52 -28L0 0M0 0V61" fill="none" stroke="#53d8fb" stroke-opacity="0.75"/>
        <path d="M-52 -28L0 -1L52 -28" fill="none" stroke="#8b7cff" stroke-opacity="0.85"/>
        <animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="4s" repeatCount="indefinite"/>
      </g>

      <circle r="5" fill="#f2c14e" filter="url(#glow)">
        <animateMotion path="M-142 0 A142 60 0 1 1 142 0 A142 60 0 1 1 -142 0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#53d8fb" filter="url(#glow)">
        <animateMotion path="M0 -112 A112 112 0 1 1 0 112 A112 112 0 1 1 0 -112" dur="9s" repeatCount="indefinite"/>
      </circle>

      <text x="0" y="158" text-anchor="middle" fill="#74839b" font-family="Consolas, monospace" font-size="12" letter-spacing="3">WORLD_CORE // ONLINE</text>
    </g>

    <g fill="#53d8fb">
      <circle cx="675" cy="64" r="2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="730" cy="278" r="2.5">
        <animate attributeName="opacity" values="1;0.12;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1128" cy="74" r="2">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#53d8fb" stroke-opacity="0.12" stroke-width="2"/>
</svg>
